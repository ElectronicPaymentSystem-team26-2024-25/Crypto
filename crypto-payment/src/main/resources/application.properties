# ===============================
# Basic App Config
# ===============================
spring.application.name=crypto-payment
server.port=8095
# obavezno, da controller generi?e ispravan absolute paymentUrl
app.public-base-url=https://localhost:8095


# CORS (ako zatreba za status iz browsera dok si na drugom originu)
# Ako status poziv ide iz crypto-pay.html (isti origin), ovo ti ne treba.

# ===============================
# SSL / HTTPS (specifikacija tra?i secure protokol)
# ===============================
server.ssl.enabled=true
server.ssl.key-store=classpath:localhost+2.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=1

# ===============================
# Database (opciono ? koristi samo ako ti treba persistence)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/CryptoDB
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# Crypto Provider (BlockCypher Testnet)
# ===============================
crypto.provider=blockcypher
crypto.blockcypher.base-url=https://api.blockcypher.com/v1/btc/test3
crypto.blockcypher.token=4cef7dad86eb44589c9d528323867471
crypto.blockcypher.confirmations-required=0
crypto.blockcypher.webhook-secret=change-me


# ===============================
# PSP Core Integration (callback za status porud?bine)
# ===============================
psp.core.order-status-callback-url=http://localhost:8080/payment/order-status/crypto
psp.core.auth.bearer-token=dev-token


# ===============================
# JWT / Security (ako za?titi? API)
# ===============================
jwt.secret-key=QngjHNS1UwMYKIO7nSmJ7lRwe122z1L0IsLFydruiwHjC9p16HzuKugEDVt4xfMA


spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML


# Preciznost BTC iznosa (decimale)
crypto.fx.decimals=8

# BTC po 1 jedinici valute (BTC-per-fiat)
crypto.fx.rate.RSD=0.00000005   # ~5e-8 BTC za 1 RSD (demo)
crypto.fx.rate.EUR=0.00001500   # ~1.5e-5 BTC za 1 EUR (demo)

# demo instant potvrda (0-conf)
crypto.demo.zero-conf=true

# Tolerancija u satoshijima (0 = strogo)
crypto.payment.underpaid-tolerance-sats=0
